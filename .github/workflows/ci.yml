name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux-only for push/PR (saves Windows 2x / macOS 10x Actions minutes).
        # ci.yml only runs on push/PR — tag builds are handled by release.yml,
        # so a tag-conditional here would be dead code. Add extra OSes to
        # release.yml if cross-platform release testing is ever needed.
        os: [ubuntu-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # Retry to self-heal transient npm registry / network failures.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck, test, and build
        run: npm run check

      - name: Pack npm release tarball
        id: pack-tarball
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # check already built dist; skip prepack rebuild so stdout stays the .tgz name only
          $name = (npm pack --ignore-scripts | Select-Object -Last 1).ToString().Trim()
          if ($name -notmatch '\.tgz$') { throw "Unexpected npm pack output: $name" }
          $path = Join-Path $PWD $name
          if (-not (Test-Path -LiteralPath $path)) { throw "Packed tarball missing: $path" }
          "tarball=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Packed $name"

      - name: Smoke-install packed tarball
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tarballName = '${{ steps.pack-tarball.outputs.tarball }}'
          $tarballPath = Join-Path $env:GITHUB_WORKSPACE $tarballName
          if (-not (Test-Path -LiteralPath $tarballPath)) { throw "Tarball not found: $tarballPath" }

          $smokeRoot = Join-Path ([System.IO.Path]::GetTempPath()) ("cpm-pack-smoke-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          try {
            Set-Location $smokeRoot
            npm init -y | Out-Null
            # Non-interactive CLI only; skip optional OpenTUI/Bun natives for pack smoke.
            npm install --omit=optional $tarballPath
            $cli = Join-Path $smokeRoot 'node_modules/@onlinechefgroep/coding-provider-manager/dist/cli.js'
            if (-not (Test-Path -LiteralPath $cli)) { throw "Installed CLI missing: $cli" }
            Write-Host '==> cpm --version'
            node $cli --version
            Write-Host '==> cpm agent manifest'
            node $cli agent manifest
          }
          finally {
            Set-Location $env:GITHUB_WORKSPACE
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
